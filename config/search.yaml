  - pharmazeut

# Description phrases that mean a hard requirement she cannot meet yet.
exclude_text:
  - approbation als arzt erforderlich
  - approbation ist erforderlich
  - abgeschlossene facharztweiterbildung
  - deutsch auf c2
  - verhandlungssichere deutschkenntnisse
  - deutsch verhandlungssicher
  - no longer accepting applications
  - bewerbungsfrist ist abgelaufen
  - stelle ist bereits besetzt

# Board sources --------------------------------------------------------------

bundesagentur:
  enabled: true
  radius_km: 30
  days: 7            # first run uses first_run_days
  first_run_days: 30
  size: 50
  cities: [Berlin, Hamburg, Frankfurt am Main, München, Heidelberg]

jobspy:
  enabled: true
  sites: [indeed, google, linkedin]
  results_wanted: 15
  hours_old: 72
  queries:            # subset of queries for the international boards
    - Studienassistenz
    - Study Coordinator
    - Clinical Trial Assistant
    - Clinical Research Coordinator
    - Research Assistant medical
    - Wissenschaftliche Hilfskraft
    - Wissenschaftliche Mitarbeiterin Epidemiologie
    - PhD epidemiology
    - PhD public health
    - Doktorand Medizin
    - women's health research
    - Spanish speaking clinical research
  places:
    - {location: Berlin, country: germany}
    - {location: Hamburg, country: germany}
    - {location: Frankfurt am Main, country: germany}
    - {location: München, country: germany}
    - {location: Wien, country: austria}
    - {location: Zürich, country: switzerland}
    - {location: Germany, country: germany, remote: true}

# Career pages and niche boards, read with crawl4ai. Each listing page is
# rendered, links that look like job postings are collected (link_pattern),
# and each new posting is read via JSON-LD (schema.org/JobPosting) or as
# markdown.
sites:
  - name: Charité
    url: https://karriere.charite.de/en/job-vacancies
    link_pattern: /job-vacancies/detail/\d+
    location: Berlin
  - name: EURAXESS
    url: https://euraxess.ec.europa.eu/jobs/search?keywords=epidemiology%20germany
    link_pattern: /jobs/\d+
  - name: EURAXESS
    url: https://euraxess.ec.europa.eu/jobs/search?keywords=public%20health%20germany
    link_pattern: /jobs/\d+
  - name: EURAXESS
    url: https://euraxess.ec.europa.eu/jobs/search?keywords=women%27s%20health
    link_pattern: /jobs/\d+
  - name: EURAXESS
    url: https://euraxess.ec.europa.eu/jobs/search?keywords=obstetrics
    link_pattern: /jobs/\d+
  - name: EURAXESS
    url: https://euraxess.ec.europa.eu/jobs/search?keywords=phd%20medicine%20germany
    link_pattern: /jobs/\d+
  - name: EURAXESS
    url: https://euraxess.ec.europa.eu/jobs/search?keywords=clinical%20research%20germany
    link_pattern: /jobs/\d+
  # Not included: Berlin Institute of Health (Cloudflare bot check) and ICON (robots.txt forbids crawling).
  # Their German postings still arrive through the Bundesagentur and job boards.
