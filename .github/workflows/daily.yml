name: Daily job search

on:
  schedule:
    # Main trigger: cron-job.org calls the workflow_dispatch API at 06:30 Berlin time.
    # This schedule is only a fallback (already-known postings are skipped, no second push).
    - cron: "3 8 * * *"   # 09:03 CET / 10:03 CEST
  workflow_dispatch:
    inputs:
      notify:
        description: "Send ntfy push"
        type: boolean
        default: true
      only_sources:
        description: "Only these sources (comma list: bundesagentur,jobspy,ats,sites), empty = all"
        type: string
        default: ""
      fresh_start:
        description: "Forget earlier verdicts and judge all postings again"
        type: boolean
        default: false
      catchup_round:
        description: "Set by the workflow itself: number of this catch-up run (0 = normal run)"
        type: number
        default: 0

permissions:
  contents: read
  actions: write   # keepalive re-enables the schedule

concurrency:
  group: daily-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 160   # includes the 30-minute wait of catch-up runs
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_ALERT_TOPIC: ${{ secrets.NTFY_ALERT_TOPIC }}
      BOARD_URL: ${{ vars.BOARD_URL }}
      FRESH_START: ${{ inputs.fresh_start }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      NOTIFY: ${{ (github.event_name == 'schedule' || inputs.notify) && '1' || '0' }}
      ONLY_SOURCES: ${{ inputs.only_sources }}
    steps:
      - name: Wait before catch-up
        # Gemini overloads usually pass within half an hour.
        if: inputs.catchup_round > 0
        run: sleep 1800

      - uses: actions/checkout@v4

      - name: Personal data check
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: python3 scripts/pii_check.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Install scraper
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Load state
        run: node scripts/blob.mjs get

      - name: Search
        id: search
        run: python scraper/main.py

      - name: Save state
        if: success()
        run: node scripts/blob.mjs put

      - name: Start catch-up run
        # Postings left unchecked (Gemini overloaded, time budget, check limit) are
        # checked by up to 3 follow-up runs. If the daily Gemini quota is used up,
        # the next morning's run picks them up instead.
        if: >-
          success() && !inputs.fresh_start
          && fromJSON(steps.search.outputs.backlog || '0') > 0
          && steps.search.outputs.quota_exhausted != 'true'
          && (inputs.catchup_round || 0) < 3
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ inputs.catchup_round || 0 }}
        run: |
          ROUND=$((PREV + 1))
          echo "backlog ${{ steps.search.outputs.backlog }}, starting catch-up round $ROUND"
          gh workflow run daily.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f notify=true -f only_sources= -f fresh_start=false -f catchup_round="$ROUND"

      - name: Alert on failure
        if: failure() && env.NTFY_TOPIC != ''
        run: |
          curl -s -H "Title: Jobboard: taeglicher Lauf fehlgeschlagen" -H "Priority: low" -H "Tags: warning" \
            -H "Click: $RUN_URL" -d "Der Lauf ist abgebrochen. Details im Actions-Protokoll." \
            "https://ntfy.sh/${NTFY_ALERT_TOPIC:-$NTFY_TOPIC}" > /dev/null

  keepalive:
    # GitHub disables scheduled workflows after 60 days without repository
    # activity. Re-enabling the workflow resets that timer.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow enable daily.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
