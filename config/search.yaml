  - {type: workday, name: Parexel, host: parexel.wd1.myworkdayjobs.com, tenant: parexel, site: Parexel_External_Careers}
  - {type: workday, name: Syneos Health, host: syneoshealth.wd12.myworkdayjobs.com, tenant: syneoshealth, site: syneos_health_external_site}
  - {type: workday, name: Fortrea, host: fortrea.wd1.myworkdayjobs.com, tenant: fortrea, site: Fortrea}
  - {type: workday, name: Labcorp, host: labcorp.wd1.myworkdayjobs.com, tenant: labcorp, site: External}
  - {type: workday, name: Thermo Fisher (PPD), host: thermofisher.wd5.myworkdayjobs.com, tenant: thermofisher, site: ThermoFisherCareers}

# Matching and notifications ------------------------------------------------
matching:
  # gemini (free tier via Google AI Studio key) or claude (paid API key).
  # The LLM_PROVIDER environment variable overrides this.
  provider: gemini
  gemini:
    model: ""            # empty = newest Flash model the key can use
    pause_seconds: 4
  model: claude-sonnet-5-5         # used when provider is claude
  fallback_model: claude-haiku-5-5  # used when the free Gemini quota is used up (needs ANTHROPIC_API_KEY)
  effort: low
  max_llm_checks_per_run: 400
  # Hard rules applied to the checked result (see scraper/match.py decide()).
  rules:
    allowed_roles: [phd, study_assistant, research_assistant]
    max_german: B2           # postings that demand C1 or more are rejected
    max_years_experience: 0  # any explicitly required years of experience reject
  max_check_minutes: 60      # stop checking after this, rest goes to the next run (job timeout 120 min)
  min_prefilter_score: 1     # at least one topic word or query hit
notify:
  min_score: 60
  high_priority_score: 80
  max_items: 5
  max_failed_sources: 3
keep_days: 60
