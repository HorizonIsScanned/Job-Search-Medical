# Search configuration. Contains no personal data: the candidate profile
# lives in the PROFILE_JSON secret, never in this repository.

# Places a job may be in. A job also passes when it is remote.
locations:
  - name: Berlin
    aliases: [berlin, potsdam, nuthetal, rehbrücke, teltow, hennigsdorf, schönefeld, kleinmachnow]
  - name: Hamburg
    aliases: [hamburg, norderstedt, borstel]
  - name: Frankfurt am Main
    aliases: [frankfurt, bad homburg, offenbach, eschborn, neu-isenburg, langen, oberursel]
  - name: München
    aliases: [münchen, muenchen, munich, martinsried, planegg, neuherberg, garching, unterschleißheim]
  - name: Wien
    aliases: [wien, vienna]
    country: austria
  - name: Zürich
    aliases: [zürich, zuerich, zurich]
    country: switzerland
  - name: Heidelberg
    aliases: [heidelberg, mannheim]
remote_words: [remote, homeoffice, home office, home-office, mobiles arbeiten, telearbeit]

# Search terms for the job boards (Bundesagentur, Indeed, Google, LinkedIn).
queries:
  # Study assistance / coordination (CROs, university hospitals)
  - Studienassistenz
  - Studienassistent
  - Clinical Trial Assistant
  - Study Coordinator
  - Studienkoordinator
  - Studienkoordination
  - Clinical Research Coordinator
  - Study Assistant
  # Research assistant / Hilfskraft
  - Research Assistant
  - Wissenschaftliche Hilfskraft
  - Wissenschaftliche Mitarbeiterin Epidemiologie
  - Wissenschaftliche Mitarbeiterin Public Health
  - Wissenschaftliche Mitarbeiterin Frauenheilkunde
  - Wissenschaftliche Mitarbeiterin Versorgungsforschung
  # PhD / doctorate
  - Doktorand Medizin
  - Doktorandin Epidemiologie
  - Promotion Frauenheilkunde
  - Promotionsstelle Public Health
  - PhD epidemiology
  - PhD public health
  - PhD women's health
  # Fields
  - Epidemiologie
  - Prävention Forschung
  - Frauengesundheit
  - Geburtshilfe Studie
  - Spanish speaking clinical research

# Topics and weights for the score (0-100 is computed from these + the requirement check).
topics:
  womens_health:
    label: Frauengesundheit
    weight: 30
    words: [gynäkolog, gynecolog, geburtshilf, obstetric, frauenheilkunde, frauengesundheit, women's health, womens health, reproduktion, reproductive, fertilit, endometrios, schwangerschaft, pregnan, pränatal, prenatal, perinatal, mamma, brust, breast, menopaus, klimakter, stillen, breastfeed, lactation, maternal, hebamm, midwif]
  imaging:
    label: Bildgebung
    weight: 25
    words: [radiolog, bildgebung, imaging, mrt, mri, ct-, computertomograph, ultraschall, ultrasound, sonograph, nuklearmedizin, pet-, bildanalyse, image analysis, neuroimaging]
  neurology:
    label: Neurologie
    weight: 20
    words: [neurolog, neuro, gehirn, brain, schlaganfall, stroke, demenz, dementia, alzheimer, parkinson, epileps, multiple sklerose, multiple sclerosis]
  ophthalmology:
    label: Augenheilkunde
    weight: 20
    words: [ophthalmolog, augenheilkunde, augenklinik, retina, netzhaut, glaukom, glaucoma, oct, eye]
  medical:
    label: Medizin allgemein
    weight: 3
    words: [medizin, medical, klinisch, clinical, patient, gesundheit, health, pharma, medtech, arzt, ärztin, physician, doctor]
  epidemiology:
    label: Epidemiologie & Prävention
    weight: 30
    words: [epidemiolog, public health, prävention, praevention, prevention, preventive, gesundheitsförderung, versorgungsforschung, health services research, kohorte, cohort, bevölkerungs, population health, global health, impfung, vaccin, infektionsepidemiolog]
  research:
    label: Klinische Forschung
    weight: 10
    words: [studie, study, clinical trial, klinische forschung, clinical research, epidemiolog, public health, biostatist, medical writing, pharmakovigilanz, pharmacovigilance, promotion, doktorand, phd, doctoral]

# Titles that are dropped before any further check (requires a licence, a
# specialist title, a student status, or is not a medical-knowledge role).
